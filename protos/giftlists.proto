syntax = "proto3";

package giftlist.giftlists.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Gateway.Infrastructure.GiftLists.Grpc";

// GL-71: the browser's grpc-web entry point for the GiftLists command surface. One RPC per
// command in GiftLists.Contracts.GiftLists (CreateGiftList/RenameGiftList/DeleteGiftList/
// AddGiftItem/RemoveGiftItem), so the two evolve independently — mirrors identity.proto's own
// rationale exactly (GL-18 is the precedent this file follows).
//
// Every RPC here is fire-and-forget, the same as the Rebus command it wraps (ARCHITECTURE.md
// "Command → event flow" — CreateGiftListHandler's remarks say so explicitly): the Gateway sends the command onto
// the bus and returns as soon as it is accepted, never awaiting GiftLists' reply. The SPA learns
// the outcome when the read model (GL-23's myGiftLists/giftList(id)) catches up, not from this
// RPC's response.
//
// Deliberately carries no owner/requester field on any message: GatewayGrpcEndpointRouteBuilder-
// Extensions requires authentication on this whole service, and every Gateway.Infrastructure
// GiftLists RPC reads the caller's own id off the validated JWT
// (Gateway.Infrastructure.Platform.Security, the ServerCallContext counterpart of
// HttpContextExtensions.RequireUserId) rather than trusting a client-supplied field — there is no
// ownership check downstream in GiftLists' handlers to catch a mistake here, unlike GL-23's read
// path. Never add one; a client could populate it to act as someone else.
//
// list_id/item_id are generated by the Gateway (not the browser) inside each RPC handler and
// echoed back in the response, so the SPA knows the id before the read model catches up — the
// same reason GiftLists.Contracts.GiftLists.CreateGiftList takes ListId as a caller-supplied
// argument in the first place.
//
// Consumed from two places: Grpc.Tools generates the C# server stubs straight from this file for
// Gateway.Infrastructure (see Gateway.Infrastructure.csproj's <Protobuf> item); `buf generate`
// (web/buf.gen.yaml) generates the TypeScript client for the SPA from the exact same file, so the
// two never drift from each other.
service GiftListsService {
  rpc CreateGiftList(CreateGiftListRequest) returns (CreateGiftListResponse);
  rpc RenameGiftList(RenameGiftListRequest) returns (RenameGiftListResponse);
  rpc DeleteGiftList(DeleteGiftListRequest) returns (DeleteGiftListResponse);
  rpc AddGiftItem(AddGiftItemRequest) returns (AddGiftItemResponse);
  rpc RemoveGiftItem(RemoveGiftItemRequest) returns (RemoveGiftItemResponse);
}

message CreateGiftListRequest {
  string name = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message CreateGiftListResponse {
  // Gateway-generated; the caller learns the new list's id here, ahead of the read model.
  string list_id = 1;
}

message RenameGiftListRequest {
  string list_id = 1;
  string name = 2;
}

message RenameGiftListResponse {
}

message DeleteGiftListRequest {
  string list_id = 1;
}

message DeleteGiftListResponse {
}

message AddGiftItemRequest {
  string list_id = 1;
  string name = 2;
  optional string description = 3;
  optional string url = 4;
}

message AddGiftItemResponse {
  // Gateway-generated; the caller learns the new item's id here, ahead of the read model.
  string item_id = 1;
}

message RemoveGiftItemRequest {
  string list_id = 1;
  string item_id = 2;
}

message RemoveGiftItemResponse {
}
