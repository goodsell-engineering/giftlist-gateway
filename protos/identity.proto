syntax = "proto3";

package giftlist.identity.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Gateway.Infrastructure.Users.Grpc";

// GL-18: the browser's grpc-web entry point for sign-up and log-in. The Gateway proxies each
// RPC to Identity over the Rebus request/reply bridge (ARCHITECTURE.md "Command → event flow") rather than calling
// it directly — this service carries no business logic of its own, only wire translation. One
// RPC per Identity command (SignUp/Login, Identity.Contracts.Users), so the two stay easy to
// evolve independently.
//
// Consumed from two places: Grpc.Tools generates the C# server stubs straight from this file for
// Gateway.Infrastructure (see Gateway.Infrastructure.csproj's <Protobuf> item); `buf generate`
// (web/buf.gen.yaml) generates the TypeScript client for the SPA from the exact same file, so the
// two never drift from each other.
service AuthService {
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
}

message SignUpRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
}

message SignUpResponse {
  string user_id = 1;
  string access_token = 2;
  google.protobuf.Timestamp access_token_expires_at = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string user_id = 1;
  string access_token = 2;
  google.protobuf.Timestamp access_token_expires_at = 3;
}
